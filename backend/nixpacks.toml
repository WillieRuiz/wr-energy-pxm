# System packages required by WeasyPrint (PDF generation)
# Railway (nixpacks) installs these before pip dependencies
[phases.setup]
nixPkgs = [
  "python3",
  "pango",
  "cairo",
  "gdk-pixbuf",
  "libffi",
  "fontconfig",
  "gobject-introspection",
  "harfbuzz",
  "pkg-config",
]

# nixpacks auto-generates "python -m venv" but in the nix env the binary
# is "python3" — override the install phase to use the correct name
[phases.install]
cmds = [
  "python3 -m venv --copies /opt/venv",
  ". /opt/venv/bin/activate && pip install -r requirements.txt",
]
